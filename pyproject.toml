[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-reliability"
version = "0.1.0"
description = "Leakage-safe NHTSA recall propensity proxy and Streamlit dashboard"
requires-python = ">=3.10"
dependencies = [
    "defusedxml>=0.7.1",
    "openpyxl>=3.1.5",
    "filelock>=3.15",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "plotly>=5.18",
    "pyarrow>=14.0",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "seaborn>=0.13",
    "streamlit>=1.31",
    "thefuzz[speedup]>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
auto-reliability = "auto_reliability.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# The product deliberately degrades to a baseline/UI diagnostic when optional
# model, parquet, or report artefacts fail at runtime. Those boundary catches
# are intentional and are covered by integration tests.
ignore = ["BLE001", "S112"]
